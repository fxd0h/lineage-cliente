# Empaquetado y releases.
# - Un tag v* (git tag v0.1.0 && git push origin v0.1.0): compila, corre los tests, arma el .dmg de macOS, los
#   .zip de Windows y el AppImage y el .tar.gz de Linux (x64 y arm64), y publica la release en GitHub con notas generadas.
# - A mano (Actions > Release > Run workflow): lo mismo sin publicar; los paquetes quedan como artefactos.
#   Con `tag` (p. ej. v0.2.0), los paquetes llevan esa versión y se suman a esa release los que le falten
#   (sin reemplazar los que ya tiene): así se agregan plataformas nuevas a una release publicada.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release existente a la que sumar los paquetes que le falten (p. ej. v0.2.0); vacío = no publicar"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest  # Apple Silicon; las versiones fijas dejan de existir (macos-14 ya no está)
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: brew install ninja glslang spirv-cross  # shaders: HLSL -> SPIR-V -> MSL

      - name: Tests
        run: |
          cmake --preset debug
          cmake --build --preset debug --target lin_tests
          build/debug/lin_tests  # sin LINEAGE_DIR se saltan los que necesitan los recursos del juego

      - name: Empaquetar
        id: paquete
        run: |
          TAG="${{ inputs.tag }}"
          [[ -n "$TAG" || "$GITHUB_REF_TYPE" != tag ]] || TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          [[ -n "$TAG" ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          echo "dmg=$(herramientas/empaquetar_macos.sh "$VERSION" | tail -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-macos
          path: ${{ steps.paquete.outputs.dmg }}

  windows:
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: python -m pip install ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Tests
        run: |
          cmake --preset debug
          cmake --build --preset debug --target lin_tests
          build/debug/lin_tests.exe  # sin LINEAGE_DIR se saltan los que necesitan los recursos del juego

      - name: Empaquetar
        id: paquete
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          $version = if ($tag) { $tag.Substring(1) } else { "0.0.0-$("${{ github.sha }}".Substring(0, 7))" }
          $zip = herramientas/empaquetar_windows.ps1 -Version $version | Select-Object -Last 1
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-windows-${{ matrix.arch }}
          path: ${{ steps.paquete.outputs.zip }}

  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libvulkan-dev \
            glslang-tools mesa-vulkan-drivers xvfb  # shaders a SPIR-V; Vulkan por software para tests/test_gpu.cpp

      - name: Tests
        run: |
          cmake --preset debug
          cmake --build --preset debug --target lin_tests
          xvfb-run -a build/debug/lin_tests  # sin LINEAGE_DIR se saltan los que necesitan los recursos del juego

      - name: Empaquetar
        id: paquete
        run: |
          TAG="${{ inputs.tag }}"
          [[ -n "$TAG" || "$GITHUB_REF_TYPE" != tag ]] || TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          [[ -n "$TAG" ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          herramientas/empaquetar_linux.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-linux-${{ matrix.arch }}
          path: |
            dist/Lineage-*-linux-*.tar.gz
            dist/Lineage-*-linux-*.AppImage
          if-no-files-found: error

  # La release se publica una vez, con los paquetes de todos los jobs. Si ya existe (Run workflow con `tag`),
  # se le suman solo los paquetes que no tiene.
  publicar:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [[ -n "$TAG" ]] || TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" paquetes/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
            exit 0
          fi
          tiene=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for f in paquetes/*; do
            grep -qxF "$(basename "$f")" <<< "$tiene" || gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
